<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Icônes – Le Graal Croustillant</title></head>
<body style="background:#fbf3e0;font:15px system-ui;margin:16px">
<h1>Fabrique des icônes</h1>
<p>Dessine l'icône de l'application et l'enregistre dans icons/ (avec le serveur local tools/serve.ps1).</p>
<div id="out"></div>
<script type="module">
  import { drawPiece } from '../js/art.js';
  function draw(size, maskable) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(size / 2, size * 0.4, size * 0.1, size / 2, size / 2, size * 0.72);
    g.addColorStop(0, '#c8402e'); g.addColorStop(1, '#6a1a12');
    x.fillStyle = g;
    if (maskable) x.fillRect(0, 0, size, size);
    else { x.beginPath(); x.roundRect(0, 0, size, size, size * 0.22); x.fill(); }
    const m = size * 0.16;
    drawPiece(x, { c: -1, sp: 'grail' }, m, m, size - 2 * m);
    return c;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#c8402e"/><stop offset="1" stop-color="#6a1a12"/></radialGradient></defs>
<rect width="100" height="100" rx="22" fill="url(#g)"/>
<path d="M28 22 H72 Q74 52 54 56 V66 Q66 68 68 78 H32 Q34 68 46 66 V56 Q26 52 28 22Z" fill="#ffd75e" stroke="#3a2210" stroke-width="5" stroke-linejoin="round"/>
<circle cx="50" cy="38" r="6" fill="#e8263a" stroke="#3a2210" stroke-width="3"/></svg>`;
  const out = document.getElementById('out');
  const jobs = [[180, 'icon-180.png', false], [192, 'icon-192.png', false], [512, 'icon-512.png', true]];
  for (const [size, name, mask] of jobs) {
    const c = draw(size, mask);
    out.appendChild(c);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    await fetch('/__save?f=icons/' + name, { method: 'POST', body: blob });
  }
  await fetch('/__save?f=icons/icon.svg', { method: 'POST', body: svg });
  out.insertAdjacentHTML('beforeend', '<p id="done">Icônes enregistrées.</p>');
</script>
</body>
</html>
